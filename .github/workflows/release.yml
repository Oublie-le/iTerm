name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Existing release tag to rebuild"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare_release:
    name: Prepare GitHub release
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      release_id: ${{ steps.release.outputs.result }}

    steps:
      - name: Create or locate release
        id: release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        with:
          result-encoding: string
          script: |
            const tag = process.env.RELEASE_TAG;
            let release;

            try {
              const response = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              release = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;

              const response = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `iTerm ${tag}`,
                body: [
                  "iTerm 跨平台串口终端预览版。",
                  "",
                  "此版本由 GitHub Actions 自动构建，尚未进行 Apple 公证或 Windows 商业代码签名。",
                  "安装说明和已知限制请参阅仓库 README。",
                ].join("\n"),
                generate_release_notes: true,
                draft: false,
                prerelease: false,
              });
              release = response.data;
            }

            if (!release?.id) {
              core.setFailed(`GitHub Release ${tag} 没有返回有效 ID`);
              return;
            }

            core.info(`Using GitHub Release ${tag} (${release.id})`);
            return String(release.id);

  verify:
    name: Verify release source on Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version consistency
        run: pnpm version:check
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Run frontend tests
        run: pnpm test

      - name: Run terminal performance smoke test
        run: pnpm bench:terminal:smoke

      - name: Build production frontend
        run: pnpm build

  publish:
    name: Publish (${{ matrix.name }})
    needs: prepare_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            rust-targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            platform: macos-latest
            rust-targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          - name: Linux x86_64
            platform: ubuntu-22.04
            rust-targets: ""
            args: --bundles deb,appimage
          - name: Windows x86_64
            platform: windows-latest
            rust-targets: ""
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version consistency
        run: pnpm version:check
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          releaseId: ${{ needs.prepare_release.outputs.release_id }}
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: iTerm ${{ inputs.tag || github.ref_name }}
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

  sbom:
    name: Publish software bill of materials
    needs:
      - prepare_release
      - publish
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate CycloneDX SBOM
        run: pnpm sbom:generate --output "iTerm-${RELEASE_TAG}.cdx.json"
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

      - name: Upload SBOM to release
        run: gh release upload "$RELEASE_TAG" "iTerm-${RELEASE_TAG}.cdx.json" --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

  verify_assets:
    name: Confirm release assets
    needs: sbom
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Verify expected assets
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        with:
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: process.env.RELEASE_TAG,
            });
            const names = release.assets.map((asset) => asset.name);
            core.info(`Release assets: ${names.join(", ")}`);

            const expected = [
              { label: "Windows NSIS installer", test: (name) => name.endsWith("-setup.exe") },
              { label: "Apple Silicon DMG", test: (name) => name.endsWith("_aarch64.dmg") },
              { label: "Intel DMG", test: (name) => name.endsWith("_x64.dmg") },
              { label: "Debian package", test: (name) => name.endsWith("_amd64.deb") },
              { label: "Linux AppImage", test: (name) => name.endsWith("_amd64.AppImage") },
              { label: "CycloneDX SBOM", test: (name) => name.endsWith(".cdx.json") },
            ];
            const missing = expected
              .filter(({ test }) => !names.some(test))
              .map(({ label }) => label);

            if (missing.length > 0) {
              core.setFailed(`Missing release assets: ${missing.join(", ")}`);
            }
