name: Recover v0.7.2 release assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/recover-v0.7.2.yml"

permissions:
  contents: write

concurrency:
  group: recover-v0.7.2-release
  cancel-in-progress: false

jobs:
  recover:
    uses: ./.github/workflows/release.yml
    with:
      tag: v0.7.2
    secrets: inherit
