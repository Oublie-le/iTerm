[package]
name = "iterm"
version = "0.4.0"
description = "A cross-platform, local-first desktop serial, SSH, and ADB terminal"
authors = ["iTerm contributors"]
edition = "2021"
repository = "https://github.com/Oublie-le/iTerm"

[lib]
name = "iterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
encoding_rs = "0.8"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serialport = "4.9"
tauri = { version = "2", features = [] }
